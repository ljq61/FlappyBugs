<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Solid ice blue four point stardust glint with a white center</title>
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".24" stop-color="#f5ffff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#b6caff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8dccff"/>
      <stop offset=".45" stop-color="#fff"/>
      <stop offset="1" stop-color="#b4d1ff"/>
    </linearGradient>
  </defs>
  <g id="stardust-glint" stroke-linejoin="round">
    <circle id="glint-halo" cx="64" cy="64" r="57" fill="url(#halo)"/>
    <path id="glint-silhouette" d="M64 3Q70 48 81 48L125 64L81 80Q70 80 64 125Q58 80 47 80L3 64L47 48Q58 48 64 3Z" fill="url(#shine)" stroke="#78b7eb" stroke-width="4"/>
    <path id="glint-core" d="M64 31L69 59L97 64L69 69L64 97L59 69L31 64L59 59Z" fill="#fff"/>
    <circle cx="64" cy="64" r="6" fill="#fff"/>
  </g>
</svg>
