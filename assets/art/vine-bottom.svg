<svg xmlns="http://www.w3.org/2000/svg" width="180" height="150" viewBox="0 0 180 150" role="img" aria-labelledby="title">
  <title id="title">Smooth charred vine root bed beneath upward flames, with no spikes</title>
  <defs>
    <linearGradient id="vine-bottom-join-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="150">
      <stop offset="0" stop-color="#413745"/>
      <stop offset=".6" stop-color="#413745"/>
      <stop offset="1" stop-color="#413745"/>
    </linearGradient>
  </defs>
  <g stroke="#30283c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g id="burning-vine" fill="#413745">
      <path id="root-bed" d="M6 150V135Q6 120 28 122Q52 129 74 122Q90 118 110 123Q133 130 151 123Q174 120 174 136V150Z"/>
      <path id="root-coils" d="M14 144Q40 129 66 138Q91 148 111 137Q134 125 164 141M35 150Q50 139 74 144M118 150Q140 138 160 146" fill="none" stroke="#665044" stroke-width="6"/>
      <path id="ember-cracks" d="M35 128Q40 134 35 140M83 127Q91 133 86 140M136 131Q146 134 142 142" fill="none" stroke="#d9804d" stroke-width="3"/>
      <g id="embers" fill="#efb365" stroke="none"><circle cx="57" cy="132" r="2"/><circle cx="117" cy="140" r="2.5"/></g>
    </g>
  </g>
  <g id="stem-join">
    <path id="join-body" d="M2 130H178V150H2Z" fill="url(#vine-bottom-join-gradient)" stroke="none"/>
    <path id="join-left-edge" d="M2 130V150" fill="none" stroke="#30283c" stroke-width="4" stroke-linecap="butt"/>
    <path id="join-right-edge" d="M178 130V150" fill="none" stroke="#30283c" stroke-width="4" stroke-linecap="butt"/>
  </g>
</svg>
